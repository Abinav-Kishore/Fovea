# FOVEA v0.1 configuration
# All thresholds/weights here are PROTOTYPE HEURISTICS for the SIH v0.1 demo,
# not a validated or final mathematical formulation.

data:
  root: dataset  # contains sequences/<seq>/{velodyne,labels}
  sequence: "00"
  frame: 0                              # default frame index (overridden by demo autoscan)

evaluation:
  # Max range (meters) used for distance-band visualization/statistics.
  # null = auto-detect from the actual frame (99th percentile of point range),
  # so we never claim coverage the data doesn't have.
  max_range_m: null

origin:
  # Explicit coordinate origin for grid indexing (sensor/vehicle frame origin).
  x: 0.0
  y: 0.0

uniform:
  cell_size_m: 0.20

distance_adaptive:
  # Bands are contiguous, ordered, non-overlapping ranges of 3D range (meters).
  # cell_size_m strictly non-decreasing with distance (SIH monotonicity constraint).
  bands:
    - {max_m: 10,  cell_size_m: 0.05}
    - {max_m: 30,  cell_size_m: 0.10}
    - {max_m: 60,  cell_size_m: 0.25}
    - {max_m: 100, cell_size_m: 0.50}

fovea:
  # Each band's cell_size_m (above) is the COARSEST allowed size in that band
  # (matches the distance-adaptive baseline exactly). FOVEA may only refine
  # FINER within the band, down to cell_size_m / refinement_factor. It can
  # never be coarser than the band value and never finer than the floor.
  refinement_factor: 4   # quadtree: level0=base, level1=base/2, level2=base/4

  # Split thresholds on the [0,1] information score (quadtree top-down decision).
  split_to_medium_threshold: 0.35
  split_to_fine_threshold: 0.65

  weights:
    semantic: 0.5
    geometry: 0.35
    dynamic: 0.15
    uncertainty: 0.0   # no confidence available from SemanticPOSS labels -> 0 by default

  geometry:
    # geometry_score = clip(std(z within cell) / max_expected_std, 0, 1)
    max_expected_std_m: 0.5

  # Classes treated as "dynamic-relevant" in absence of temporal tracking.
  # This is a semantic-category proxy only (documented limitation), not real motion detection.
  dynamic_classes: ["1 person", "2+ person", "rider", "car", "bike"]

  # Semantic priority in [0,1], keyed EXACTLY by the names in SemanticPOSS's own
  # LABEL_DICT (see src/semantic_labels.py, copied verbatim from the dataset's
  # read_data.py). Any class not listed here defaults to 0.1 ("unknown"/unlisted).
  semantic_priority:
    unlabeled: 0.05
    "1 person": 1.0
    "2+ person": 1.0
    rider: 0.9
    car: 0.9
    trunk: 0.25
    plants: 0.15
    "traffic sign 1": 0.6
    "traffic sign 2": 0.6
    "traffic sign 3": 0.6
    pole: 0.4
    trashcan: 0.5
    building: 0.2
    "cone/stone": 0.5
    fence: 0.3
    bike: 0.7
    ground: 0.05

visualization:
  point_subsample_max: 40000   # cap points drawn in scatter views for responsiveness

benchmark:
  num_frames: 10
  repeats_for_timing: 3

# ---------------------------------------------------------------------------
# Multi-dataset support. `data:` above stays byte-identical to v0.1 -- it IS
# datasets.SemanticPOSS's root, kept in its original place so nothing that
# already reads cfg["data"]["root"] (data_loader.py, app.py, benchmark.py)
# has to change. This section only ADDS RELLIS-3D as a second dataset and
# gives SemanticPOSS an equivalent entry point under the same registry.
# ---------------------------------------------------------------------------
datasets:
  default: SemanticPOSS   # must stay SemanticPOSS -- existing commands/tests assume this

  SemanticPOSS:
    root: dataset   # identical to data.root above

  RELLIS-3D:
    # RELLIS ships as two separately-downloaded archives (point clouds and
    # annotations); we read them in place, never copy/merge them.
    pointcloud_root: Rellis-3D
    label_root: "Rellis-3D 2"
    pointcloud_subdir: vel_cloud_node_kitti_bin
    label_subdir: vel_cloud_node_semantickitti_label_id
    sequences: ["00000", "00001", "00002", "00003", "00004"]

    # PROTOTYPE HEURISTIC semantic priorities for RELLIS-3D's off-road
    # ontology (src/datasets/rellis_labels.py) -- NOT scientifically
    # validated, same heuristic spirit as SemanticPOSS's table above but a
    # SEPARATE table: RELLIS is a different scene distribution (off-road
    # terrain vs. SemanticPOSS's campus/urban), so SemanticPOSS's values are
    # not reused. Any RELLIS class not listed here defaults to 0.1, same
    # fallback convention as SemanticPOSS.
    semantic_priority:
      void: 0.05
      dirt: 0.1
      grass: 0.05
      tree: 0.25
      pole: 0.4
      water: 0.7
      sky: 0.05
      vehicle: 0.9
      object: 0.5
      asphalt: 0.05
      building: 0.2
      log: 0.6
      person: 1.0
      fence: 0.3
      bush: 0.15
      concrete: 0.05
      barrier: 0.6
      puddle: 0.55
      mud: 0.5
      rubble: 0.6

    # Semantic-category proxy only (documented limitation, identical concept
    # to SemanticPOSS's dynamic_classes -- NOT real motion/temporal tracking).
    # RELLIS's ontology has no rider/bike-equivalent category, so this list
    # is shorter than SemanticPOSS's.
    dynamic_classes: ["person", "vehicle"]

# ---------------------------------------------------------------------------
# Perception (real AI inference, src/perception/) -- used when FOVEA is run
# in "prediction" mode instead of "ground_truth" mode (see src/api.py's
# label_source query param). The FOVEA allocator itself is unmodified: it
# still just reads cfg["fovea"]["semantic_priority"]/["dynamic_classes"];
# this section provides the substitute values for those two keys specific
# to the MODEL's own ontology (semantickitti-20), since predicted labels
# are never in a dataset's own class-id space -- see src/perception/ontology.py.
# ---------------------------------------------------------------------------
perception:
  default_model: squeezeseg
  models:
    squeezeseg:
      checkpoint_dir: models/squeezeseg
      ontology: semantickitti-20

      # PROTOTYPE HEURISTIC (same status as the SemanticPOSS/RELLIS-3D
      # tables above -- not scientifically validated), keyed EXACTLY by the
      # names in the checkpoint's own data_cfg.yaml -> learning_map_inv.
      semantic_priority:
        unlabeled: 0.05
        car: 0.9
        bicycle: 0.7
        motorcycle: 0.7
        truck: 0.85
        other-vehicle: 0.8
        person: 1.0
        bicyclist: 0.9
        motorcyclist: 0.9
        road: 0.05
        parking: 0.05
        sidewalk: 0.05
        other-ground: 0.05
        building: 0.2
        fence: 0.3
        vegetation: 0.15
        trunk: 0.25
        terrain: 0.05
        pole: 0.4
        traffic-sign: 0.6

      # Semantic-category proxy only (same documented limitation as the
      # other two datasets' dynamic_classes -- NOT real motion tracking).
      dynamic_classes: ["person", "bicyclist", "motorcyclist", "car", "truck", "other-vehicle"]
